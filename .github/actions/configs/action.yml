name: add configs
description: add configs and disabling securities

runs:
 using: composite
 steps:
  - name: add mountify support
    shell: bash
    run: |
     "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_OVERLAY_FS
     "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_TMPFS_XATTR
     "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_TMPFS_POSIX_ACL
     
  - name: enable KPM support
    shell: bash
    run: |
     "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KALLSYMS
     "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KALLSYMS_ALL
     "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KPM
     
  - name: nuke securities for root access
    shell: bash
    run: |
     # 1. Determine which defconfig file needs to be patched based on the branch
     target_config=""
     
     if [[ $BRANCH == SM-S938B* || "$BRANCH" == "SM-S931B-Oneui8" ]]; then
         echo "Nothing to see here, moving on..."
     elif [[ $BRANCH == SM-S926B* ]]; then
         target_config="$COMMON/arch/arm64/configs/s5e9945-bazel_defconfig"
     elif [[ $BRANCH == SM-A556* ]]; then
         target_config="$COMMON/arch/arm64/configs/s5e8845-bazel_defconfig"
     elif [[ $BRANCH == SM-A055* ]]; then
         target_config="$CONFIG/kernel/kernel_device_modules-6.6/arch/arm64/configs/mediatek-bazel_defconfig"
     elif [[ $BRANCH == SM-A075* ]]; then
         target_config="$COMMON/arch/arm64/configs/a07_00_defconfig"
     else
         target_config="$GKI_DEFCONFIG"
     fi
     
     # 2. Apply the nuke modifications
     nuke_list=()
     if [ -n "$target_config" ]; then
       nuke_list+=("$target_config")
     fi

     # MTK-style mgk trees (e.g. SM-X926B) merge a mediatek-bazel_defconfig
     # fragment on top of gki_defconfig that RE-ENABLES UH/RKP/KDP/DEFEX/PROCA/FIVE;
     # nuke every such fragment or ReSukiSU's kernel_compat.h hard-errors.
     for frag in $CONFIG/kernel_device_modules-*/arch/arm64/configs/mediatek-bazel_defconfig; do
       [ -f "$frag" ] && nuke_list+=("$frag")
     done

     for tc in "${nuke_list[@]}"; do
      echo "Nuking Samsung Knox/Root protection in: $tc"

     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_UH
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_UH_RKP
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_UH_LKMAUTH
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_UH_LKM_BLOCK
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_RKP
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_RKP_CFP_JOPP
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_RKP_CFP_ROPP
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_RKP_CFP
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_SECURITY_DEFEX
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_PROCA
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_FIVE
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_KDP
     "$COMMON/scripts/config" --file "$tc" --disable CONFIG_KDP_NS
     #"$COMMON/scripts/config" --file "$tc" --disable CONFIG_KNOX
     #"$COMMON/scripts/config" --file "$tc" --disable CONFIG_KNOX_NCM
     #"$COMMON/scripts/config" --file "$tc" --disable CONFIG_KNOX_KAP
     done

  - name: remove check_defconfig
    shell: bash
    run: |
     cd "$COMMON"
     # Remove check_defconfig
     sed -i 's/check_defconfig//' ./build.config.gki
